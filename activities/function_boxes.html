<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>합성함수 알아보기</title><style>:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#17243b;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(26px,4vw,38px)}.panel{background:white;border-radius:24px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 26px #1c376315;margin-top:18px}.progress{display:flex;gap:9px;margin:20px 0}.dot{height:12px;flex:1;border-radius:20px;background:#dbe4ef}.dot.on{background:#3778dc}.tag{color:#42689a;font-weight:800}h2{font-size:clamp(23px,3vw,31px);margin:10px 0}p{line-height:1.6}.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:28px 0}.box{border:5px solid #3e81db;background:#e8f3ff;border-radius:22px;min-width:155px;min-height:135px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;font-size:32px;font-weight:900;transition:.3s}.box.orange{border-color:#ee9b3c;background:#fff1de}.box.active{transform:scale(1.06);box-shadow:0 0 0 7px #ffd96680}.box small{font-size:16px}.num{border-radius:18px;background:#f0f4fa;padding:20px;min-width:80px;text-align:center;font-size:34px;font-weight:900}.num.result{background:#d9f7df;color:#176a31}.arrow{font-size:30px;color:#7890ad}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:15px 22px;background:#e9eff8;color:#182b4c;font-size:20px;font-weight:800;cursor:pointer;min-height:56px}.btn:hover{filter:brightness(.96)}.btn:focus-visible{outline:4px solid #f6b846;outline-offset:3px}.choice{min-width:88px;font-size:28px;background:#eaf2ff;border:2px solid #adc9f3}.primary{background:#276bd3;color:white}.secondary{background:#fff0d3}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.feedback{min-height:70px;text-align:center;font-size:23px;font-weight:800;padding:12px}.hint{background:#fff7e4;border-radius:14px;padding:16px;margin-top:12px;text-align:center}.history{width:100%;border-collapse:collapse;margin-top:15px;text-align:center}.history th,.history td{border-bottom:1px solid #e1e8f0;padding:10px}.history th{background:#f0f5fc}.hidden{display:none!important}.selectlabel{text-align:center;font-weight:800;font-size:20px;margin:12px}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}.status{text-align:center;font-size:18px;color:#48658b}.compare{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}.compare>div{padding:16px;background:#f4f7fd;border-radius:18px;text-align:center;font-size:21px;font-weight:800}.small{font-size:15px;color:#596d89}.confetti{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.12)}}@media(max-width:600px){main{padding:12px}.panel{padding:16px}.box{min-width:105px;min-height:105px;font-size:26px}.num{min-width:58px;padding:14px;font-size:27px}.arrow{font-size:22px}.row{gap:7px}.btn{font-size:18px;padding:12px 16px}.choice{min-width:70px}}
/* Shared activity theme, embedded for standalone use. */
/* Shared appearance for the three function activities. */
:root {
  --ink: #253746;
  --muted: #687b87;
  --blue: #49687f;
  --blue-dark: #365568;
  --sage: #8eaa98;
  --sage-soft: #edf4ee;
  --amber: #e5b867;
  --amber-soft: #fff7e7;
  --line: #d9e2e5;
  --paper: #fffefb;
  --ground: #edf2f3;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color: var(--ink);
  background: var(--ground);
}

body {
  color: var(--ink);
  background: var(--ground);
  font-family: inherit;
  line-height: 1.55;
}

h1, h2, h3 {
  color: var(--ink);
  font-family: inherit;
  letter-spacing: -.025em;
}

.sub, .small, .muted, .status { color: var(--muted); }

.card, .panel {
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: 0 3px 14px rgb(37 55 70 / 6%);
}

button, input, select { font-family: inherit; }
button {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
  transition: background-color .16s ease, border-color .16s ease, box-shadow .16s ease;
}
button:not(:disabled):hover { filter: brightness(.97); }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--amber);
  outline-offset: 2px;
}

input:not([type="range"]), select {
  border-color: #aebfc5;
  color: var(--ink);
  background: var(--paper);
}
input[type="range"] { accent-color: var(--blue); }

.feedback, .hint, .notice {
  border-color: var(--amber);
  background: var(--amber-soft);
  color: var(--ink);
}

table th { background: var(--sage-soft); color: var(--ink); }
table td, table th { border-bottom-color: var(--line); }

/* Function boxes */
.progress .dot { background: var(--line); }
.progress .dot.on { background: var(--sage); }
.tag { color: var(--blue); }
.num, .number { background: var(--sage-soft); color: #365b50; }
.num.result { background: #dceee2; color: #365b50; }
.number.out { background: var(--amber-soft); color: #92632b; }
.box, .machine { border-color: var(--blue); background: #eaf0f2; color: var(--ink); }
.box.orange { border-color: var(--amber); background: var(--amber-soft); }
.box.active { box-shadow: 0 0 0 7px rgb(229 184 103 / 28%); }
.arrow { color: var(--blue); }
.btn, button.secondary, button.choice, .step, .tabs button, .steps button {
  border-color: var(--line);
  background: #eaf0f2;
  color: var(--ink);
}
.btn.primary, .step.active, .tabs button.active, .steps button.active,
button.choice.active {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}
.choice { border-color: #b8cbd3; }
.secondary, button.secondary { background: var(--amber-soft); }
.compare > div, .pill { background: var(--sage-soft); }
.completion-dialog {
  width: min(90vw, 520px);
  padding: 28px;
  border: 2px solid var(--sage);
  border-radius: 16px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 20px 60px rgb(37 55 70 / 22%);
  text-align: center;
}
.completion-dialog::backdrop { background: rgb(37 55 70 / 48%); }
.completion-dialog h2 { margin: 0 0 14px; color: #365b50; }
.completion-dialog p {
  margin: 0 0 24px;
  font-size: clamp(20px, 2.4vw, 26px);
  font-weight: 700;
  line-height: 1.55;
}

/* Graph activities */
.wrap > header, body > header { background: var(--paper); color: var(--ink); border-bottom: 1px solid var(--line); }
body > header p { color: var(--muted); }
.badge { background: var(--sage-soft); color: #365b50; }
.big, .value { color: var(--blue-dark); }
.out { color: #92632b; }
.graph { border-color: var(--line); }
.data th { background: var(--sage-soft); }

@media print {
  body { background: #fff; }
  .card, .panel { box-shadow: none; }
}

.panel.with-history{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,320px);column-gap:18px}.panel.with-history>*{grid-column:1}.panel.with-history #historyWrap{grid-column:2;grid-row:4 / span 9;align-self:start;position:sticky;top:12px;background:var(--sage-soft);padding:14px;border-radius:16px}.panel.with-history #machine{flex-wrap:nowrap;gap:5px}.panel.with-history .box{min-width:72px;min-height:78px;padding:5px;border-width:3px;border-radius:12px;font-size:22px;flex-shrink:1}.panel.with-history .box small{font-size:11px}.panel.with-history .num{min-width:39px;padding:9px;font-size:22px}.panel.with-history .arrow{font-size:20px}.panel.with-history #historyWrap h3{margin:0}.panel.with-history .history{font-size:15px}@media(max-width:700px){.panel.with-history{display:flex;flex-direction:column}.panel.with-history #historyWrap{position:static;order:-1;width:100%}}.concept-card{max-width:670px;margin:auto;border-radius:14px;overflow:hidden;background:#fff;text-align:center}.concept-title{background:#213d39;color:#fff;padding:10px;font-size:28px;font-weight:900}.concept-flow{display:flex;justify-content:center;align-items:center;gap:10px;padding:18px 12px;flex-wrap:nowrap}.concept-pair{position:relative;display:flex;gap:8px;border:4px solid #2d6256;border-radius:18px;padding:19px 10px 10px;background:#fff}.composition-label{position:absolute;top:-16px;left:50%;transform:translateX(-50%);padding:0 10px;background:#fff;color:#2d6256;font-size:20px;font-weight:900;white-space:nowrap}.concept-box{border:4px solid var(--blue);background:#eaf0f2;border-radius:17px;min-width:116px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.concept-box.second{border-color:var(--amber);background:var(--amber-soft)}.concept-box small{font-size:14px}.concept-box strong{font-size:30px}.concept-num{min-width:56px;padding:10px;background:var(--sage-soft);border-radius:14px;font-size:28px;font-weight:800}.concept-num.result{background:#dceee2}.concept-arrow{color:var(--blue);font-size:25px}.panel:has(.concept-card) .feedback{padding:8px;background:transparent}@media(max-width:600px){.concept-flow{gap:4px;padding:12px 4px}.concept-pair{gap:4px;padding:16px 4px 5px;border-width:3px}.composition-label{font-size:15px;top:-13px}.concept-box{min-width:74px;min-height:78px;border-width:3px}.concept-box small{font-size:10px}.concept-box strong{font-size:23px}.concept-num{min-width:38px;padding:7px;font-size:22px}.concept-arrow{font-size:19px}}</style></head><body><main><header><h1>📦 합성함수 알아보기</h1><button class="btn" id="resetAll">처음부터</button></header><div class="progress" id="progress" aria-label="학습 진행도"></div><section class="panel" id="panel"><div class="tag" id="stageTag"></div><h2 id="heading"></h2><p id="instruction"></p><div class="selectlabel" id="inputLabel"></div><div class="choices" id="inputs"></div><div class="row" id="machine"></div><div class="status" id="status" aria-live="polite"></div><div class="selectlabel" id="question"></div><div class="choices" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div id="hint" class="hint hidden"></div><div class="actions"><button class="btn secondary" id="hintBtn">💡 힌트</button><button class="btn" id="retryBtn">↻ 다시 해보기</button><button class="btn primary hidden" id="nextTask">다음 문제 ▶</button></div><div id="historyWrap" class="hidden"><h3>📝 내가 만든 결과</h3><table class="history"><thead><tr><th>넣은 수</th><th>첫 번째 결과</th><th>마지막 결과</th></tr></thead><tbody id="history"></tbody></table></div><div id="compare" class="compare hidden"></div><div class="footer"><button class="btn" id="prev">◀ 이전 단계</button><button class="btn primary" id="nextStage">다음 단계 ▶</button></div></section><p class="small" style="text-align:center">숫자를 고르고, 각 함수 상자의 결과를 직접 선택해 보세요. 틀려도 다시 선택할 수 있어요.</p></main><script>
const $=id=>document.getElementById(id);let stage=0,task=0,input=null,step=0,mid=null,history=[];const configs=[{title:'함수 상자 하나를 만나 봐요',desc:'숫자를 고르고, +2 함수 상자를 통과한 결과를 선택하세요.',a:['+',2],b:null,values:[1,2,3,4,5]},{title:'함수상자 2개를 이용하여 계산해봐요.',desc:'첫 번째 결과를 고른 뒤, 두 번째 결과를 골라요.',a:['+',2],b:['*',2],values:[3,2,4]},{title:'여러 숫자를 넣어 봐요',desc:'숫자를 바꿔 넣어 보고 결과를 표에 모아요.',a:['+',2],b:['*',2],values:[1,2,3,4,5]},{title:'두 함수 상자의 최종 결과를 맞혀 봐요',desc:'두 함수 상자를 차례대로 통과한 최종 결과를 바로 골라요.',a:['+',2],b:['*',2],values:[4,1,5]},{title:'합성함수 알아보기',desc:'함수상자 2개를 이어 붙여 첫번째 상자에서 나온 결과를 두번째 상자에 넣어 결과를 얻는 것은 두 함수를 합성하여 함숫값을 구하는 과정과 같습니다.'}];function calc(x,op){return op[0]==='+'?x+op[1]:x*op[1]}function label(op){return (op[0]==='+'?'+':'×')+op[1]}function getCfg(){return configs[stage]}function totalTasks(){return stage===0?3:stage===1?2:stage===2?5:stage===3?3:0}function button(txt,fn,cls='choice'){let b=document.createElement('button');b.className='btn '+cls;b.textContent=txt;b.onclick=fn;return b}function render(){let c=getCfg();$('progress').innerHTML='';for(let i=0;i<5;i++){let d=document.createElement('div');d.className='dot '+(i<=stage?'on':'');$('progress').append(d)}$('stageTag').textContent=stage===4?'개념 정리 · 5단계 / 5단계':`${stage+1}단계 / 5단계 · 문제 ${Math.min(task+1,totalTasks())} / ${totalTasks()}`;$('heading').textContent=configs[stage].title;$('instruction').textContent=configs[stage].desc;$('inputs').innerHTML='';$('answers').innerHTML='';$('feedback').textContent='';$('hint').classList.add('hidden');$('nextTask').classList.add('hidden');$('compare').classList.add('hidden');$('historyWrap').classList.toggle('hidden',stage!==2);panel.classList.toggle('with-history',stage===2);$('prev').disabled=stage===0;$('nextStage').textContent=stage===4?'학습 마치기 ✓':'다음 단계 ▶';document.querySelector('.actions').classList.toggle('hidden',stage===4);if(stage===4){$('inputLabel').textContent='';$('inputs').innerHTML='';$('machine').innerHTML='<div class="num">2</div><span class="arrow">→</span><div class="box"><small>첫 번째 함수 상자</small>+2</div><span class="arrow">→</span><div class="num">4</div><span class="arrow">→</span><div class="box orange"><small>두 번째 함수 상자</small>×2</div><span class="arrow">→</span><div class="num result">8</div>';$('status').textContent='첫 번째 결과 4를 두 번째 함수 상자에 넣으면 최종 결과는 8이에요.';$('question').textContent='';$('feedback').innerHTML='<div class="concept-card"><div class="concept-flow"><span class="concept-num">2</span><span class="concept-arrow">→</span><div class="concept-pair"><span class="composition-label">합성함수</span><div class="concept-box"><small>함수 상자</small><strong>+2</strong></div><div class="concept-box second"><small>함수 상자</small><strong>×2</strong></div></div><span class="concept-arrow">→</span><span class="concept-num result">8</span></div></div>';return}if(input===null){$('inputLabel').textContent='넣을 숫자를 선택하세요';let options=[1,2,3,4,5];options.forEach(n=>$('inputs').append(button(n,()=>{input=n;step=0;mid=null;draw()},'choice')));$('machine').innerHTML='';$('status').textContent='먼저 숫자를 선택하세요.';$('question').textContent='';return}draw()}
function draw(){let c=getCfg(),a=c.a,b=c.b;$('inputs').innerHTML='';$('inputLabel').textContent='선택한 숫자: '+input;$('machine').innerHTML='';function addNum(n,green=false){let e=document.createElement('div');e.className='num '+(green?'result':'');e.textContent=n===null?'?':n;$('machine').append(e)}function addBox(op,active){let e=document.createElement('div');e.className='box '+(b&&op===b?'orange':'')+(active?' active':'');e.innerHTML='<small>함수 상자</small>'+label(op);$('machine').append(e)}function arrow(){let e=document.createElement('span');e.className='arrow';e.textContent='→';$('machine').append(e)}if(stage===3){addNum(input);arrow();addBox(a,false);addBox(b,false);arrow();addNum(step===2?calc(calc(input,a),b):null,step===2);status.textContent=step===2?'두 함수 상자를 통과한 최종 결과예요.':'두 함수 상자를 붙여 한 번에 계산해 봐요.';answers.innerHTML='';hint.classList.add('hidden');if(step===2){done();return}let correct=calc(calc(input,a),b);question.textContent='두 함수 상자를 통과한 최종 결과는?';[correct-2,correct-1,correct,correct+1,correct+2].filter(n=>n>=0).forEach(n=>answers.append(button(n,()=>{if(n!==correct){feedback.textContent='다시 생각해 볼까요? 🙂';return}mid=calc(input,a);step=2;draw()})));return}addNum(input);arrow();addBox(a,step===0);arrow();addNum(step>=1?mid:null,step>=1);if(b){arrow();addBox(b,step===1);arrow();addNum(step>=2?calc(mid,b):null,step>=2)}$('status').textContent=step===0?'첫 번째 함수 상자에 숫자가 들어갔어요.':step===1?'첫 번째 결과가 두 번째 함수 상자에 들어가요.':'두 함수 상자를 모두 통과했어요!';$('answers').innerHTML='';$('question').textContent='';$('hint').classList.add('hidden');if(step===(b?2:1)){done();return}let op=step===0?a:b,x=step===0?input:mid,correct=calc(x,op);$('question').textContent=step===0?'첫 번째 함수 상자에서 나오는 숫자는?':'두 번째 함수 상자에서 나오는 숫자는?';let opts=[correct-2,correct-1,correct,correct+1,correct+2].filter(v=>v>=0);opts=[...new Set(opts)].sort((u,v)=>u-v);opts.forEach(n=>$('answers').append(button(n,()=>{if(n!==correct){$('feedback').textContent='다시 생각해 볼까요? 🙂';return}if(step===0){mid=n;step=1}else step=2;$('feedback').textContent='정답이에요! 🎉';setTimeout(()=>{$('feedback').textContent='';draw()},550)})));$('feedback').textContent=''}function done(){let c=getCfg(),out=c.b?calc(mid,c.b):mid;$('question').textContent='';$('answers').innerHTML='';$('feedback').textContent=`🎉 잘했어요! 함수 상자에 ${input}을 넣으면 ${out}가 나와요.`;if(stage===2&&!history.some(h=>h.x===input)){history.push({x:input,m:mid,y:out});$('history').innerHTML=history.map(h=>`<tr><td>${h.x}</td><td>${h.m}</td><td>${h.y}</td></tr>`).join('')}if(task<totalTasks()-1)$('nextTask').classList.remove('hidden');else {$('feedback').textContent+=' 이 단계의 문제를 모두 풀었어요!';}}function restart(){input=null;step=0;mid=null;render()}$('nextTask').onclick=()=>{if(task<totalTasks()-1){task++;restart()}};$('retryBtn').onclick=restart;$('hintBtn').onclick=()=>{if(input===null)return;let c=getCfg();if(stage===3){hint.textContent=`${input} ${label(c.a)} → ${calc(input,c.a)} ${label(c.b)} = ?  차례대로 계산해 보세요.`;hint.classList.remove('hidden');return}let op=step===0?c.a:c.b,x=step===0?input:mid;if(!op)return;$('hint').textContent=`${x} ${op[0]==='+'?'+':'×'} ${op[1]} = ?  숫자를 차근차근 계산해 보세요.`;$('hint').classList.remove('hidden')};$('prev').onclick=()=>{if(stage>0){stage--;task=0;restart()}};$('nextStage').onclick=()=>{if(stage<4){stage++;task=0;restart()}else{alert('🎉 합성함수 알아보기를 마쳤어요!')}};$('resetAll').onclick=()=>{if(confirm('처음부터 다시 시작할까요?')){stage=0;task=0;history=[];restart()}};render();</script></body></html>
