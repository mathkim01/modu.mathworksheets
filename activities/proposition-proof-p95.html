<script>const data=[
{section:'Ⅰ. 대우와 귀류법을 이용한 증명',items:[
{title:'제곱이 짝수이면 원래 수도 짝수',src:'92~93쪽',statement:'자연수 n에 대하여 “n²이 짝수이면 n은 짝수이다.”를 증명하시오. (대우 이용)',proof:[
'주어진 명제의 대우는 “자연수 n이 {{홀수이면}} n²은 {{홀수이다}}.”이다.',
'n이 홀수이면 자연수 k에 대하여 n=2k−1로 나타낼 수 있다.',
'n²=(2k−1)²=4k²−4k+1=2({{2k²−2k}})+1이다.',
'{{2k²−2k}}는 정수이므로 n²은 홀수이다.',
'대우가 참이므로 주어진 명제도 참이다.']},
{title:'√2는 무리수',src:'93쪽',statement:'“√2는 유리수가 아니다.”를 귀류법으로 증명하시오.',proof:[
'√2가 {{유리수}}라고 가정하면 서로소인 자연수 m, n에 대해 √2=m/n으로 나타낼 수 있다.',
'양변을 제곱하면 2n²=m²이므로 m²은 짝수이고, 따라서 m도 {{짝수}}이다.',
'm=2k로 놓으면 2n²=4k², 즉 n²={{2k²}}이므로 n도 {{짝수}}이다.',
'그러면 m, n이 모두 짝수여서 {{서로소}}라는 가정에 모순이다.',
'따라서 √2는 무리수이다.']},
{title:'제곱이 홀수이면 원래 수도 홀수',src:'93쪽 스스로 익히기 1',statement:'자연수 n에 대하여 “n²이 홀수이면 n은 홀수이다.”를 대우를 이용하여 증명하시오.',proof:[
'주어진 명제의 대우는 “n이 {{짝수이면}} n²은 {{짝수이다}}.”이다.',
'n=2k(k는 자연수)라고 놓으면 n²=(2k)²={{4k²}}=2({{2k²}})이다.',
'따라서 n²은 {{짝수}}이다.',
'대우가 참이므로 원래 명제도 참이다.']},
{title:'1+√2는 무리수',src:'93쪽 스스로 익히기 2',statement:'“1+√2는 유리수가 아니다.”를 귀류법으로 증명하시오.',proof:[
'1+√2가 {{유리수}}라고 가정하자.',
'유리수에서 유리수 1을 빼면 유리수이므로 √2=(1+√2)−1도 {{유리수}}이다.',
'이는 “√2는 {{무리수}}이다.”라는 사실과 모순이다.',
'따라서 1+√2는 무리수이다.']},
{title:'두 수 중 하나가 짝수이면 곱은 짝수',src:'99쪽 06',statement:'자연수 m, n에 대하여 “mn이 짝수이려면 m 또는 n은 짝수이다.”가 참임을 대우를 이용하여 증명하시오. (짝수일 필요조건)',proof:[
'명제를 “mn이 짝수이면 m 또는 n이 짝수이다.”로 해석한다.',
'그 대우는 “m과 n이 모두 {{홀수이면}} mn은 {{홀수이다}}.”이다.',
'm=2a−1, n=2b−1(a, b는 자연수)라고 하면',
'mn=(2a−1)(2b−1)=2({{2ab−a−b}})+1이다.',
'따라서 mn이 홀수이므로 대우가 참이고 원래 명제도 참이다.']}
]},
{section:'Ⅱ. 절대부등식의 증명',items:[
{title:'제곱의 합을 이용한 절대부등식',src:'94쪽 활동하기',statement:'실수 a, b에 대하여 a²+5b²≥4ab임을 증명하시오. 등호가 성립할 조건도 찾으시오.',proof:[
'a²+5b²−4ab=({{a−2b}})²+{{b²}}이다.',
'실수의 제곱은 항상 {{0 이상}}이므로 a²+5b²−4ab≥0이다.',
'따라서 a²+5b²≥4ab이다.',
'등호가 성립하려면 a−2b=0이고 b=0이어야 하므로 {{a=b=0}}이다.']},
{title:'산술·기하평균 부등식',src:'94쪽 예제 1',statement:'a>0, b>0일 때 (a+b)/2 ≥ √(ab)임을 증명하시오. 등호 조건도 구하시오.',proof:[
'(a+b)/2−√(ab)=(a+b−2√(ab))/2',
'=({{√a−√b}})²/2≥{{0}}이다.',
'따라서 (a+b)/2 ≥ √(ab)이다.',
'등호는 √a=√b, 즉 {{a=b}}일 때 성립한다.']},
{title:'삼각부등식',src:'95쪽 스스로 익히기 2',statement:'실수 a, b에 대하여 |a|+|b|≥|a+b|임을 증명하시오. 등호 조건도 구하시오.',proof:[
'|a|+|b|≥0, |a+b|≥0이므로 두 양을 {{제곱하여}} 비교할 수 있다.',
'(|a|+|b|)²−|a+b|²=(a²+2|ab|+b²)−(a²+2ab+b²)',
'=2({{|ab|−ab}})≥{{0}}이다.',
'따라서 |a|+|b|≥|a+b|이다.',
'등호는 |ab|=ab, 즉 {{ab≥0}}일 때 성립한다.']},
{title:'양수의 비와 역수의 합',src:'95쪽 스스로 익히기 3 (1)',statement:'a>0, b>0일 때 b/a+a/b≥2임을 증명하시오. 등호 조건도 구하시오.',proof:[
'b/a+a/b−2=(a²+b²−2ab)/(ab)',
'=({{a−b}})²/(ab)≥{{0}} (ab>0).',
'따라서 b/a+a/b≥2이다.',
'등호는 {{a=b}}일 때 성립한다.']},
{title:'4a와 1/a의 합',src:'95쪽 스스로 익히기 3 (2)',statement:'a>0일 때 4a+1/a≥4임을 증명하시오. 등호 조건도 구하시오.',proof:[
'4a+1/a−4=(4a²−4a+1)/a',
'=({{2a−1}})²/a≥{{0}} (a>0).',
'따라서 4a+1/a≥4이다.',
'등호는 2a−1=0, 즉 {{a=1/2}}일 때 성립한다.']}
]}];</script>
<script>
const meta={"title": "명제의 증명", "subtitle": "대우, 귀류법, 절대부등식과 등호 조건을 단계별로 탐구합니다.", "nav": ["대우와 귀류법", "절대부등식"], "badges": ["증명 방법", "식의 변형"], "intros": ["명제의 대우를 증명하거나 모순을 이끌어 내는 방법을 확인합니다.", "제곱식이 0 이상임을 이용해 부등식과 등호 조건을 증명합니다."], "summaries": ["대우가 참이면 원래 명제도 참이며, 귀류법은 가정에서 모순을 찾습니다.", "부등식의 차를 0 이상인 식으로 나타내고, 언제 0이 되는지도 확인합니다."]};
const root=document.getElementById('contents');
const nav=document.getElementById('navLinks');
let total=0;
const mathPattern=/[A-Za-z0-9√¬∅ᶜ|({−-][A-Za-z0-9√¬∅ᶜ∩∪∈⊂≥≤≠=+\-−×÷*/^²³(){}|<>∨⇒ ,]*[=<>≤≥≠∈⊂∩∪⇒∨+\-−×÷*/²³√][A-Za-z0-9√¬∅ᶜ∩∪∈⊂≥≤≠=+\-−×÷*/^²³(){}|<>∨⇒ ,]*/g;
function decode(s){const t=document.createElement('textarea');t.innerHTML=String(s);return t.value}
function toTex(s){let t=s.trim();t=t.replaceAll('{','\\{').replaceAll('}','\\}');t=t.replace(/√\(([^)]+)\)/g,'\\sqrt{$1}');t=t.replace(/√([A-Za-z0-9]+)/g,'\\sqrt{$1}').replaceAll('²','^{2}').replaceAll('³','^{3}').replaceAll('⇒','\\Rightarrow ').replaceAll('¬','\\neg ').replaceAll('∅','\\varnothing ').replaceAll('∩','\\cap ').replaceAll('∪','\\cup ').replaceAll('∈','\\in ').replaceAll('⊂','\\subseteq ').replaceAll('≥','\\ge ').replaceAll('≤','\\le ').replaceAll('≠','\\ne ').replaceAll('∨','\\lor ').replaceAll('−','-').replaceAll('ᶜ','^{c}');t=t.replace(/\(([^()]+)\)\/\(([^()]+)\)/g,'\\frac{$1}{$2}').replace(/\(([^()]+)\)\/([A-Za-z0-9]+)/g,'\\frac{$1}{$2}').replace(/([A-Za-z0-9]+)\/([A-Za-z0-9]+)/g,'\\frac{$1}{$2}');return t}
function addText(parent,raw){const s=decode(raw);mathPattern.lastIndex=0;let last=0;for(const m of s.matchAll(mathPattern)){const expr=m[0],start=m.index;if(start>last)parent.append(document.createTextNode(s.slice(last,start)));const span=document.createElement('span');span.className='math-inline';span.textContent='\\('+toTex(expr)+'\\)';parent.append(span);last=start+expr.length}if(last<s.length)parent.append(document.createTextNode(s.slice(last)))}
function addParts(parent,s){const chunks=String(s).split(/(\{\{.*?\}\})/g);for(const chunk of chunks){if(chunk.startsWith('{{')&&chunk.endsWith('}}')){total++;const b=document.createElement('button');b.type='button';b.className='blank';b.dataset.answer=decode(chunk.slice(2,-2));b.setAttribute('aria-label','정답 보기');b.setAttribute('aria-pressed','false');b.textContent='클릭';parent.append(b)}else addText(parent,chunk)}}
function make(tag,className,textValue){const e=document.createElement(tag);if(className)e.className=className;if(textValue!==undefined)e.textContent=textValue;return e}
data.forEach((group,gi)=>{const section=make('section','lesson-section');section.id='section'+(gi+1);const sh=make('div','section-header');sh.append(make('h2','',group.section),make('span','badge',meta.badges[gi]||'탐구와 정리'));section.append(sh);section.append(make('p','section-intro',meta.intros[gi]||'문제를 읽고 풀이의 핵심을 확인해 봅시다.'));const link=make('a','',meta.nav[gi]||group.section);link.href='#'+section.id;nav.append(link);group.items.forEach((item,ii)=>{const card=make('article','activity');const head=make('div','activity-head');head.append(make('span','num',String(ii+1).padStart(2,'0')),make('h3','',item.title),make('span','source','교과서 '+item.src));card.append(head);const q=make('div','question-box');addText(q,item.statement);card.append(q);const details=make('details','dialogue-wrapper');details.open=true;details.append(make('summary','','풀이 단계 보기 · 접기'));const steps=make('ol','steps');item.proof.forEach(line=>{const li=make('li');addParts(li,line);steps.append(li)});details.append(steps);if(item.answer){const a=make('div','answer');a.append(make('span','answer-label','정답'));addParts(a,item.answer);details.append(a)}card.append(details);section.append(card)});const summary=make('div','summary-box');summary.append(make('strong','','✦ 핵심 정리'),make('p','',meta.summaries[gi]||'풀이의 핵심 원리를 설명할 수 있는지 확인해 봅시다.'));section.append(summary);const back=make('a','backtop','↑ 맨 위로');back.href='#top';section.append(back);root.append(section)});
function typeset(scope){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([scope]).catch(err=>console.error('수식 렌더링 오류',err))}
function toggle(b,show,render=true){b.classList.toggle('revealed',show);b.replaceChildren();if(show)addText(b,b.dataset.answer);else b.textContent='클릭';b.setAttribute('aria-label',show?'정답 가리기':'정답 보기');b.setAttribute('aria-pressed',show?'true':'false');if(show&&render)typeset(b)}
function update(){document.getElementById('progress').textContent=`정답 확인 ${document.querySelectorAll('.blank.revealed').length} / ${total}칸`}
root.addEventListener('click',e=>{const b=e.target.closest('.blank');if(!b)return;toggle(b,!b.classList.contains('revealed'));update()});
document.getElementById('showAll').addEventListener('click',()=>{document.querySelectorAll('.blank').forEach(b=>toggle(b,true,false));typeset(root);update()});
document.getElementById('hideAll').addEventListener('click',()=>{document.querySelectorAll('.blank').forEach(b=>toggle(b,false));update()});
document.getElementById('toggleProofs').addEventListener('click',e=>{const list=[...document.querySelectorAll('.dialogue-wrapper')];const open=list.some(d=>!d.open);list.forEach(d=>d.open=open);e.currentTarget.textContent=open?'풀이 모두 접기':'풀이 모두 보기'});
document.getElementById('printNote').addEventListener('click',()=>window.print());
update();
</script>
</body></html>
